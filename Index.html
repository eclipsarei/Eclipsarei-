<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eclipsarei | Programador</title>
<meta name="description" content="Eclipsarei, programador de JavaScript, Python e Java. Redes e contato.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070408; --blood:#3a0710; --crimson:#b0132e; --ember:#e2384f;
  --ash:#e4dcda; --dim:#a89fa2; --eye:#e3b93f;
  /* C.C. */
  --cream:#f3eee2; --ink:#2a1d3b; --ink2:#5d5069; --mint:#8fcaa4; --mint-l:#dcefe1;
  --geass:#c8175a; --gold:#b98f28;
  --display:'Cinzel','Trajan Pro',Georgia,serif;
  --body:'Cormorant Garamond',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--void);color:var(--ash);font-family:var(--body);font-size:1.2rem;line-height:1.6;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--eye);outline-offset:3px}
.wrap{width:min(1040px,100% - 2.5rem);margin-inline:auto}

header{position:absolute;inset:0 0 auto 0;z-index:5;padding:1.4rem 0}
nav{display:flex;justify-content:space-between;align-items:center;gap:1rem}
nav .logo{font-family:var(--display);font-weight:700;letter-spacing:.18em;text-decoration:none;font-size:.95rem}
nav ul{display:flex;gap:1.6rem;list-style:none}
nav ul a{text-decoration:none;color:var(--dim);transition:color .2s}
nav ul a:hover{color:var(--eye)}

/* ===== Saber Alter ===== */
.hero{
  position:relative;min-height:100svh;display:grid;place-items:center;text-align:center;isolation:isolate;
  background:
    radial-gradient(ellipse 50% 60% at 50% 105%,rgba(176,19,46,.55),transparent 70%),
    radial-gradient(ellipse 80% 50% at 50% 0%,var(--blood),transparent 70%),var(--void);
}
.blade{position:absolute;left:50%;top:0;bottom:0;width:min(300px,60vw);transform:translateX(-50%);z-index:-1;opacity:.9}
.blade svg{width:100%;height:100%}
.blade .aura{animation:pulse 4.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.blade .edge{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.4s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.eyes{display:inline-flex;gap:.7rem;margin-bottom:1.4rem}
.eyes i{width:34px;height:5px;background:var(--eye);clip-path:polygon(0 50%,100% 0,85% 100%);box-shadow:0 0 12px var(--eye)}
.eyes i:last-child{transform:scaleX(-1)}
.hero h1{
  font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,10vw,6.4rem);
  letter-spacing:.12em;line-height:1;padding-left:.12em;text-shadow:0 0 40px rgba(176,19,46,.8),0 2px 0 #000;
}
.role{margin-top:1.2rem;font-family:var(--display);font-weight:500;letter-spacing:.3em;font-size:clamp(.95rem,3vw,1.3rem);color:var(--eye);text-shadow:0 1px 8px #000}
.chips{list-style:none;display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin:1.4rem 0 2.2rem}
.chips li{padding:.3rem 1.1rem;font-style:italic;font-size:1.25rem;background:rgba(7,4,8,.6);box-shadow:inset 0 0 0 1px var(--crimson)}
.actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-block;text-decoration:none;font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:.9rem;
  padding:.95rem 2rem;background:var(--crimson);color:#fff;border:0;cursor:pointer;
  clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:background .2s,color .2s;
}
.btn:hover{background:var(--eye);color:#140a00}
.btn.ghost{background:transparent;color:var(--ash);box-shadow:inset 0 0 0 1px var(--crimson);clip-path:none}
.btn.ghost:hover{background:var(--crimson);color:#fff}

section.block{padding:6rem 0}
.rule{height:2px;width:90px;background:linear-gradient(90deg,var(--crimson),transparent);margin-bottom:1.4rem}
h2{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:.1em;margin-bottom:.6rem}
.lead{color:var(--dim);max-width:52ch;margin-bottom:2.8rem}

.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.6rem}
.lang{
  padding:2rem 1.6rem 2.2rem;border-left:3px solid var(--crimson);
  background:linear-gradient(160deg,#1a0b12,#0b060a);
  clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%);transition:border-color .25s,transform .25s;
}
.lang:hover{border-color:var(--eye);transform:translateY(-4px)}
.lang h3{font-family:var(--display);font-size:1.6rem;letter-spacing:.06em;margin-bottom:.5rem}
.lang p{color:var(--dim);font-size:1.1rem;line-height:1.5}

/* ===== C.C. / Code Geass ===== */
/* A imagem da C.C. está embutida no fim deste CSS (--cc-img), então não precisa de arquivo separado */
.contact{
  position:relative;color:var(--ink);padding:9rem 0 6rem;overflow:hidden;isolation:isolate;
  clip-path:polygon(0 56px,100% 0,100% 100%,0 100%);
  background:
    radial-gradient(ellipse 45% 55% at 88% 15%,rgba(143,202,164,.55),transparent 70%),
    radial-gradient(ellipse 40% 50% at 5% 95%,rgba(200,23,90,.14),transparent 70%),
    var(--cream);
}
.cc-art{ /* wallpaper da seção; a camada clara à esquerda mantém o texto legível */
  position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(243,238,226,.95) 0%,rgba(243,238,226,.80) 38%,rgba(243,238,226,.10) 100%),
    var(--cc-img) center 37%/cover no-repeat;
}
.sigil{position:absolute;right:-110px;top:40px;width:min(580px,95vw);color:var(--geass);opacity:.16;z-index:-1;pointer-events:none;
  filter:drop-shadow(0 0 18px rgba(200,23,90,.5));animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hair{position:absolute;left:-5%;bottom:0;width:110%;height:42%;z-index:-1;pointer-events:none;animation:sway 14s ease-in-out infinite alternate}
.hair path{fill:none;stroke:var(--mint);stroke-width:2;vector-effect:non-scaling-stroke;opacity:.7}
.hair path.fill{fill:rgba(143,202,164,.22);stroke:none}
@keyframes sway{from{transform:translateX(-2%)}to{transform:translateX(2%)}}
.contact .wrap{position:relative;z-index:1}
.contract{
  font-family:var(--display);font-style:normal;font-weight:500;letter-spacing:.06em;
  font-size:clamp(1.3rem,4vw,2rem);color:var(--geass);margin:.2rem 0 .4rem;
  display:flex;align-items:center;gap:.8rem;
}
.contract::before{content:"";width:1.4rem;height:1.4rem;flex:none;background:var(--geass);
  clip-path:polygon(50% 0,62% 38%,100% 38%,69% 60%,81% 100%,50% 75%,19% 100%,31% 60%,0 38%,38% 38%)}
.gold-rule{height:2px;width:min(340px,70%);margin:0 0 2.2rem;background:linear-gradient(90deg,var(--gold),transparent)}
.contact .rule{background:linear-gradient(90deg,var(--geass),var(--mint))}
.contact h2{color:var(--ink)}
.contact h2,.contract,.contact .lead{text-shadow:0 0 10px rgba(243,238,226,.95),0 0 3px rgba(243,238,226,.9)}
.contact .lead{color:var(--ink2)}
.socials{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.1rem}
.social{
  display:flex;flex-direction:column;gap:.15rem;height:100%;width:100%;text-align:left;text-decoration:none;font:inherit;color:var(--ink);cursor:pointer;
  padding:1.1rem 1.3rem 1.2rem;background:rgba(251,249,243,.82);backdrop-filter:blur(6px);border:1px solid var(--mint);border-left:5px solid var(--mint);
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%);transition:background .2s,border-color .2s,transform .2s;
}
.socials li{filter:drop-shadow(0 6px 10px rgba(42,29,59,.13))}
.social:hover{background:var(--mint-l);border-left-color:var(--geass);transform:translateY(-3px)}
.social b{font-family:var(--display);font-size:.95rem;letter-spacing:.12em;color:var(--geass)}
.social span{font-size:1.3rem;overflow-wrap:anywhere}
.social small{color:var(--ink2);font-size:.95rem;font-style:italic}
.music{
  margin-top:3.2rem;padding:1.4rem;background:rgba(220,239,225,.85);backdrop-filter:blur(6px);border-left:5px solid var(--geass);
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%);
}
.music h3{font-family:var(--display);font-size:1.1rem;letter-spacing:.1em;margin-bottom:.2rem}
.music p{color:var(--ink2);margin-bottom:1rem;font-size:1.05rem}
.music iframe{display:block;width:100%;height:152px;border:0;border-radius:12px}
.music a{color:var(--geass)}
footer.cc{background:var(--cream);color:var(--ink2);text-align:center;padding:1.6rem 0 2.2rem;font-size:1rem;border-top:1px solid var(--mint)}

@media (max-width:640px){
  nav ul{gap:1rem;font-size:1rem}
  .contact{padding-top:19rem}
  .cc-art{bottom:auto;height:max(100svh,760px);
    background:linear-gradient(rgba(243,238,226,.35),rgba(243,238,226,.35)),var(--cc-img) 64% 0/cover no-repeat;
    -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 70%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 0,#000 70%,transparent 100%)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .blade .edge{stroke-dashoffset:0}
}
